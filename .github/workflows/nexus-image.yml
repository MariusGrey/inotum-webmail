# NEXUS MAIL — pubblica l'immagine della webmail su GHCR a ogni tag "v*".
#   git tag v1.9.2-nexus.9 && git push inotum v1.9.2-nexus.9
# -> ghcr.io/<owner>/nexus-webmail:1.9.2-nexus.9  (pubblica: le istanze fanno solo `docker compose pull`)
# I workflow upstream di Bulwark sono stati rimossi dal fork: pubblicavano un'immagine
# "-beta" a ogni push su main e fallivano.
name: Immagine nexus-webmail

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: nome
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tag="${GITHUB_REF_NAME#v}"
          [ "${{ github.ref_type }}" = "tag" ] || tag="manual-${GITHUB_SHA::8}"
          echo "image=ghcr.io/$owner/nexus-webmail:$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.nome.outputs.image }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: echo "pubblicata ${{ steps.nome.outputs.image }}"
